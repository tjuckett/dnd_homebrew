<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000">
  <defs>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0 L0 0 0 25" fill="none" stroke="#33404d" stroke-width="1"/></pattern>
    <style>
      .wall{fill:url(#grid);stroke:#d3ad65;stroke-width:8}.thin{fill:none;stroke:#d3ad65;stroke-width:4}
      .door{stroke:#ef9b4d;stroke-width:9}.route{fill:#163947;stroke:#69c7dc;stroke-width:4}
      .portal{fill:#352453;stroke:#a783ff;stroke-width:5}.zone{fill:none;stroke:#8796a5;stroke-width:3;stroke-dasharray:10 8}
      .party{fill:#7b3030;stroke:#ff7b6e;stroke-width:4}.label{fill:#edf2f6;font-family:Arial,sans-serif;font-size:18px;text-anchor:middle}
      .small{font-size:14px}.title{fill:#f3d593;font-family:Arial,sans-serif;font-size:26px;font-weight:bold;text-anchor:middle}
    </style>
  </defs>
  <rect width="1000" height="1000" fill="#111820"/>
  <rect x="150" y="150" width="700" height="700" fill="url(#grid)" class="wall"/>
  <text x="500" y="76" class="title">LEVEL 5 — THRONE &amp; CONTINUITY AUDIT • 5 FT GRID • NORTH ↑</text>

  <!-- Audit chamber -->
  <rect x="300" y="175" width="400" height="200" rx="35" class="portal"/>
  <text x="500" y="235" class="label">CONTINUITY AUDIT</text><text x="500" y="260" class="label">CHAMBER</text>
  <circle cx="500" cy="310" r="38" class="portal"/>
  <text x="500" y="315" class="label small">PROJECTOR</text>

  <!-- Rear hall and current party -->
  <rect x="250" y="375" width="500" height="80" class="zone"/>
  <text x="500" y="449" class="label small">REAR EXECUTIVE HALL</text>
  <line x1="455" y1="375" x2="545" y2="375" class="door"/>
  <text x="500" y="397" class="label small">PARTY / DEFEATED HEAVY GUARDS</text>
  <circle cx="460" cy="420" r="16" class="party"/><circle cx="500" cy="420" r="16" class="party"/><circle cx="540" cy="420" r="16" class="party"/>

  <!-- Throne room -->
  <rect x="275" y="455" width="450" height="285" class="thin"/>
  <rect x="410" y="470" width="180" height="65" class="portal"/>
  <text x="500" y="510" class="label">THRONE DAIS</text>
  <path d="M350 570 H650 M350 620 H650 M350 670 H650" class="zone"/>
  <text x="500" y="595" class="label small">MARKED AUDIENCE POSITIONS</text>
  <line x1="450" y1="740" x2="550" y2="740" class="door"/>

  <!-- Guard galleries -->
  <rect x="175" y="455" width="80" height="285" class="thin"/>
  <rect x="745" y="455" width="80" height="285" class="thin"/>
  <text x="215" y="600" class="label small" transform="rotate(-90 215 600)">WEST GUARD GALLERY</text>
  <text x="785" y="600" class="label small" transform="rotate(90 785 600)">EAST GUARD GALLERY</text>

  <!-- Petition and strategy rooms -->
  <rect x="175" y="755" width="190" height="70" class="thin"/>
  <text x="270" y="795" class="label small">PETITION ROOM</text>
  <rect x="635" y="755" width="190" height="70" class="thin"/>
  <text x="730" y="795" class="label small">STRATEGY ALCOVE</text>

  <!-- Command stair and service lift -->
  <rect x="175" y="245" width="100" height="120" class="route"/>
  <text x="225" y="295" class="label small">COMMAND</text><text x="225" y="315" class="label small">STAIR ↓</text>
  <rect x="725" y="245" width="100" height="120" class="route"/>
  <text x="775" y="295" class="label small">SERVICE</text><text x="775" y="315" class="label small">LIFT ↓</text>

  <!-- Hidden upper stair -->
  <rect x="725" y="175" width="100" height="50" class="route"/>
  <text x="775" y="195" class="label small">HIDDEN</text><text x="775" y="214" class="label small">STAIR ↑</text>

  <!-- Main throne entrance -->
  <line x1="440" y1="850" x2="560" y2="850" class="door"/>
  <text x="500" y="878" class="label small">MAIN THRONE ENTRANCE / VISIBLE GUARDS</text>
</svg>
