<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000">
  <defs>
    <pattern id="grid" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0 L0 0 0 25" fill="none" stroke="#33404d" stroke-width="1"/></pattern>
    <style>
      .wall{fill:url(#grid);stroke:#d3ad65;stroke-width:8}.thin{fill:none;stroke:#d3ad65;stroke-width:4}
      .door{stroke:#ef9b4d;stroke-width:9}.route{fill:#163947;stroke:#69c7dc;stroke-width:4}
      .portal{fill:#352453;stroke:#a783ff;stroke-width:6}.anchor{fill:#4b356c;stroke:#c5a8ff;stroke-width:5}
      .zone{fill:none;stroke:#8796a5;stroke-width:3;stroke-dasharray:10 8}.over{fill:none;stroke:#69c7dc;stroke-width:3;stroke-dasharray:8 8}
      .label{fill:#edf2f6;font-family:Arial,sans-serif;font-size:18px;text-anchor:middle}.small{font-size:14px}
      .title{fill:#f3d593;font-family:Arial,sans-serif;font-size:26px;font-weight:bold;text-anchor:middle}
    </style>
  </defs>
  <rect width="1000" height="1000" fill="#111820"/>
  <rect x="75" y="75" width="850" height="850" fill="url(#grid)" class="wall"/>
  <text x="500" y="36" class="title">LEVEL 2 — GRAND PORTAL CHAMBER • 5 FT GRID • NORTH ↑</text>
  <text x="500" y="62" class="label small">DISABLE ANY 2 ANCHORS → SHROUD DROPS → WRIST CLOSURE ENABLED</text>

  <!-- Portal -->
  <path d="M350 150 Q500 45 650 150 L650 225 L350 225 Z" class="portal"/>
  <ellipse cx="500" cy="175" rx="100" ry="55" fill="#181327" stroke="#c5a8ff" stroke-width="4"/>
  <text x="500" y="181" class="label">ACTIVE PORTAL</text>
  <rect x="300" y="225" width="400" height="150" class="zone"/>
  <text x="500" y="300" class="label">THRESHOLD / EXCLUSION ZONE</text>

  <!-- Anchors -->
  <circle cx="235" cy="350" r="55" class="anchor"/><text x="235" y="346" class="label small">WEST FLOOR</text><text x="235" y="365" class="label small">ANCHOR</text>
  <circle cx="765" cy="350" r="55" class="anchor"/><text x="765" y="346" class="label small">EAST FLOOR</text><text x="765" y="365" class="label small">ANCHOR</text>
  <circle cx="500" cy="245" r="38" class="over"/><text x="500" y="250" class="label small">UPPER ANCHOR</text>

  <!-- Intake ramps -->
  <polygon points="320,900 430,900 455,660 345,660" class="route"/>
  <polygon points="570,900 680,900 655,660 545,660" class="route"/>
  <text x="385" y="790" class="label small" transform="rotate(-84 385 790)">RAMP A FROM LEVEL 1</text>
  <text x="615" y="790" class="label small" transform="rotate(84 615 790)">RAMP B FROM LEVEL 1</text>

  <!-- Intake lanes -->
  <path d="M375 650 L375 430 L475 375 M625 650 L625 430 L525 375" class="zone"/>
  <text x="500" y="530" class="label">CITIZEN INTAKE LANES</text>
  <rect x="405" y="555" width="190" height="85" class="zone"/>
  <text x="500" y="590" class="label small">PROJECTOR DEPLOYMENT</text><text x="500" y="610" class="label small">RECOMMENDED POSITION</text>

  <!-- Side bypasses -->
  <path d="M125 800 L175 800 L175 225 L300 225" class="over"/>
  <path d="M875 800 L825 800 L825 225 L700 225" class="over"/>
  <text x="150" y="525" class="label small" transform="rotate(-90 150 525)">CONCLAVE EQUIPMENT BYPASS</text>
  <text x="850" y="525" class="label small" transform="rotate(90 850 525)">CONCLAVE EQUIPMENT BYPASS</text>

  <!-- Lift and gallery stair -->
  <rect x="795" y="690" width="100" height="135" class="route"/>
  <text x="845" y="750" class="label small">SERVICE</text><text x="845" y="770" class="label small">LIFT</text>
  <rect x="105" y="690" width="110" height="135" class="route"/>
  <text x="160" y="748" class="label small">STAIR TO</text><text x="160" y="768" class="label small">GALLERY</text>

  <!-- Overhead gallery -->
  <rect x="175" y="105" width="650" height="350" class="over"/>
  <text x="500" y="425" class="label small">LEVEL 3 GALLERY OVERHEAD</text>
</svg>
